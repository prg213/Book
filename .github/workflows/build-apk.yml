name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you trigger it manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node + pnpm ───────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Build web app ─────────────────────────────────────────────────────
      - name: Build MyStoryBook web app
        run: pnpm --filter @workspace/mystorybook run build
        env:
          PORT: '3000'
          BASE_PATH: './'

      # ── Capacitor: generate Android project & sync ────────────────────────
      - name: Add Android platform
        working-directory: artifacts/mystorybook
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: artifacts/mystorybook
        run: npx cap sync android

      # ── Patch AndroidManifest with permissions + deep-link scheme ────────
      # The mystorybook:// scheme lets Clerk redirect back into the app
      # after Google OAuth in Chrome Custom Tab (Browser.open).
      - name: Patch AndroidManifest
        working-directory: artifacts/mystorybook/android/app/src/main
        run: |
          python3 - <<'EOF'
          import re, pathlib

          path = pathlib.Path("AndroidManifest.xml")
          xml  = path.read_text()

          # 1. Add permissions before </manifest>
          perms = (
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n'
          )
          xml = xml.replace("</manifest>", perms + "</manifest>")

          # 2. Add mystorybook:// intent-filter inside MainActivity's <activity> block,
          #    just before the first </activity> tag.
          deep_link_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="mystorybook" />
                  </intent-filter>
          """
          xml = xml.replace("</activity>", deep_link_filter + "    </activity>", 1)

          path.write_text(xml)
          print("Patched AndroidManifest.xml:")
          print(xml)
          EOF

      # ── Patch MainActivity: remove WebView user-agent "wv" flag ──────────
      # Google blocks OAuth inside standard WebViews based on this flag.
      # Removing it lets Google OAuth work in-page without a Chrome Custom Tab.
      - name: Patch MainActivity user agent
        run: |
          DEST="artifacts/mystorybook/android/app/src/main/java/com/mystorybook/app/MainActivity.java"
          cp "artifacts/mystorybook/android-extras/com/mystorybook/app/MainActivity.java" "$DEST"
          echo "Patched MainActivity.java:"
          cat "$DEST"

      # ── Java 17 (required by modern Gradle / AGP) ─────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/mystorybook/android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload APK as a downloadable artifact ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStoryBook-debug
          path: artifacts/mystorybook/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
