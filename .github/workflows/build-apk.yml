name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you trigger it manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node + pnpm ───────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Build web app ─────────────────────────────────────────────────────
      - name: Build MyStoryBook web app
        run: pnpm --filter @workspace/mystorybook run build
        env:
          PORT: '3000'
          BASE_PATH: './'

      # ── Capacitor: generate Android project & sync ────────────────────────
      - name: Add Android platform
        working-directory: artifacts/mystorybook
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: artifacts/mystorybook
        run: npx cap sync android

      # ── Patch AndroidManifest with required permissions ───────────────────
      - name: Add Android permissions
        working-directory: artifacts/mystorybook/android/app/src/main
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n</manifest>|' AndroidManifest.xml

      # ── Patch MainActivity: remove WebView user-agent "wv" flag ──────────
      # Google blocks OAuth inside standard WebViews based on this flag.
      # Removing it lets Google OAuth work in-page without a Chrome Custom Tab.
      - name: Patch MainActivity user agent
        run: |
          DEST="artifacts/mystorybook/android/app/src/main/java/com/mystorybook/app/MainActivity.java"
          cp "artifacts/mystorybook/android-extras/com/mystorybook/app/MainActivity.java" "$DEST"
          echo "Patched MainActivity.java:"
          cat "$DEST"

      # ── Java 17 (required by modern Gradle / AGP) ─────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/mystorybook/android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload APK as a downloadable artifact ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStoryBook-debug
          path: artifacts/mystorybook/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
