name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you trigger it manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node + pnpm ───────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Build web app ─────────────────────────────────────────────────────
      - name: Build MyStoryBook web app
        run: pnpm --filter @workspace/mystorybook run build
        env:
          PORT: '3000'
          BASE_PATH: './'

      # ── Capacitor: generate Android project & sync ────────────────────────
      - name: Add Android platform
        working-directory: artifacts/mystorybook
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: artifacts/mystorybook
        run: npx cap sync android

      # ── Restore fixed signing keystore ────────────────────────────────────
      # A repo-committed PKCS12 keystore ensures every build produces the same
      # certificate fingerprint, which is required for Android App Links.
      # The SHA-256 of this cert is in public/.well-known/assetlinks.json.
      - name: Restore signing keystore
        run: |
          base64 -d artifacts/mystorybook/android-extras/debug.keystore.p12.b64 \
            > /tmp/mystorybook-debug.p12
          echo "Keystore restored at /tmp/mystorybook-debug.p12"

      # ── Patch AndroidManifest: permissions + App Links intent filter ───────
      # App Links (autoVerify) let Android intercept the Clerk OAuth callback
      # URL (https://grok-canvas-copy.replit.app/sso-callback) and route it
      # back into the app instead of keeping it in Chrome Custom Tab.
      - name: Patch AndroidManifest
        working-directory: artifacts/mystorybook/android/app/src/main
        run: |
          python3 - <<'EOF'
          import pathlib

          path = pathlib.Path("AndroidManifest.xml")
          xml  = path.read_text()

          # 1. Add permissions before </manifest>
          perms = (
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n'
          )
          xml = xml.replace("</manifest>", perms + "</manifest>")

          # 2. Add App Links intent-filter inside MainActivity's <activity> block.
          #    android:autoVerify="true" triggers domain verification so Android
          #    intercepts https://grok-canvas-copy.replit.app/sso-callback URLs.
          app_links_filter = """
                  <intent-filter android:autoVerify="true">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https"
                            android:host="grok-canvas-copy.replit.app"
                            android:pathPrefix="/sso-callback" />
                  </intent-filter>
          """
          xml = xml.replace("</activity>", app_links_filter + "    </activity>", 1)

          path.write_text(xml)
          print("Patched AndroidManifest.xml:")
          print(xml)
          EOF

      # ── Configure Gradle to sign with our fixed keystore ──────────────────
      - name: Configure Gradle signing
        working-directory: artifacts/mystorybook/android/app
        run: |
          python3 - <<'EOF'
          import pathlib, re

          path = pathlib.Path("build.gradle")
          content = path.read_text()

          signing_block = """
              signingConfigs {
                  fixedDebug {
                      storeFile file('/tmp/mystorybook-debug.p12')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                      storeType 'PKCS12'
                  }
              }
          """

          # Insert signingConfigs before buildTypes
          content = content.replace(
              "    buildTypes {",
              signing_block + "    buildTypes {"
          )

          # Override the debug build to use our fixed signing config
          content = content.replace(
              "debug {",
              "debug {\n            signingConfig signingConfigs.fixedDebug",
              1
          )

          path.write_text(content)
          print("Patched app/build.gradle with fixed signing config")
          EOF

      # ── Patch MainActivity: remove WebView user-agent "wv" flag ──────────
      # Google blocks OAuth inside standard WebViews based on this flag.
      # Removing it lets Google OAuth work in-page without a Chrome Custom Tab.
      - name: Copy custom Java sources (MainActivity + plugins)
        run: |
          DEST_DIR="artifacts/mystorybook/android/app/src/main/java/com/mystorybook/app"
          cp artifacts/mystorybook/android-extras/com/mystorybook/app/*.java "$DEST_DIR/"
          echo "Copied Java files:"
          ls "$DEST_DIR/"

      # ── Apply custom app icon ─────────────────────────────────────────────
      - name: Copy app icon mipmap resources
        run: |
          RES_DIR="artifacts/mystorybook/android/app/src/main/res"
          # Legacy PNG icons (Android 7 and below)
          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp artifacts/mystorybook/android-extras/res/${density}/ic_launcher.png       "$RES_DIR/${density}/ic_launcher.png"
            cp artifacts/mystorybook/android-extras/res/${density}/ic_launcher_round.png "$RES_DIR/${density}/ic_launcher_round.png"
          done
          # Adaptive icons (Android 8+ — takes priority over the PNGs above)
          mkdir -p "$RES_DIR/mipmap-anydpi-v26"
          cp artifacts/mystorybook/android-extras/res/mipmap-anydpi-v26/ic_launcher.xml       "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          cp artifacts/mystorybook/android-extras/res/mipmap-anydpi-v26/ic_launcher_round.xml "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          # Background gradient + foreground bitmap drawable
          cp artifacts/mystorybook/android-extras/res/drawable/ic_launcher_background.xml "$RES_DIR/drawable/ic_launcher_background.xml"
          cp artifacts/mystorybook/android-extras/res/drawable/ic_launcher_foreground.xml "$RES_DIR/drawable/ic_launcher_foreground.xml"
          cp artifacts/mystorybook/android-extras/res/drawable/ic_launcher_fg.png         "$RES_DIR/drawable/ic_launcher_fg.png"
          echo "App icons applied (legacy + adaptive)"

      # ── Java 17 (required by modern Gradle / AGP) ─────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/mystorybook/android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload APK as a downloadable artifact ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStoryBook-debug
          path: artifacts/mystorybook/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

