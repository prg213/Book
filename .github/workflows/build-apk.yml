name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you trigger it manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node + pnpm ───────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Build web app ─────────────────────────────────────────────────────
      - name: Build MyStoryBook web app
        run: pnpm --filter @workspace/mystorybook run build
        env:
          PORT: '3000'
          BASE_PATH: './'

      # ── Capacitor: generate Android project & sync ────────────────────────
      - name: Add Android platform
        working-directory: artifacts/mystorybook
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: artifacts/mystorybook
        run: npx cap sync android

      # ── Patch AndroidManifest: permissions + App Links intent filter ───────
      # App Links (autoVerify) let Android intercept the Clerk OAuth callback
      # URL (https://grok-canvas-copy.replit.app/sso-callback) and route it
      # back into the app instead of keeping it in Chrome Custom Tab.
      - name: Patch AndroidManifest
        working-directory: artifacts/mystorybook/android/app/src/main
        run: |
          python3 - <<'EOF'
          import pathlib

          path = pathlib.Path("AndroidManifest.xml")
          xml  = path.read_text()

          # 1. Add permissions before </manifest>
          perms = (
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n'
          )
          xml = xml.replace("</manifest>", perms + "</manifest>")

          # 2. Add App Links intent-filter inside MainActivity's <activity> block.
          #    android:autoVerify="true" triggers domain verification so Android
          #    intercepts https://grok-canvas-copy.replit.app/sso-callback URLs.
          app_links_filter = """
                  <intent-filter android:autoVerify="true">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https"
                            android:host="grok-canvas-copy.replit.app"
                            android:pathPrefix="/sso-callback" />
                  </intent-filter>
          """
          xml = xml.replace("</activity>", app_links_filter + "    </activity>", 1)

          path.write_text(xml)
          print("Patched AndroidManifest.xml:")
          print(xml)
          EOF

      # ── Restore release keystore from secret ─────────────────────────────
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/mystorybook-release.p12
          echo "Release keystore restored at /tmp/mystorybook-release.p12"

      # ── Configure Gradle to sign the release build ────────────────────────
      - name: Configure Gradle signing
        working-directory: artifacts/mystorybook/android/app
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import pathlib, os

          path = pathlib.Path("build.gradle")
          content = path.read_text()

          ks_pass   = os.environ["RELEASE_KEYSTORE_PASSWORD"]
          key_alias = os.environ["RELEASE_KEY_ALIAS"]
          # PKCS12 uses a single password for both the store and every key entry.
          # Using a different keyPassword causes "Given final block not properly padded".
          key_pass  = ks_pass

          signing_block = f"""
              signingConfigs {{
                  release {{
                      storeFile file('/tmp/mystorybook-release.p12')
                      storePassword '{ks_pass}'
                      keyAlias '{key_alias}'
                      keyPassword '{key_pass}'
                      storeType 'PKCS12'
                  }}
              }}
          """

          # Insert signingConfigs before buildTypes
          content = content.replace(
              "    buildTypes {",
              signing_block + "    buildTypes {"
          )

          # Inject signingConfig into the existing release {} block.
          # Target minifyEnabled (only in buildTypes.release, never in signingConfigs)
          # to avoid accidentally matching the signingConfigs.release { block we just added.
          content = content.replace(
              "minifyEnabled false",
              "signingConfig signingConfigs.release\n            minifyEnabled false",
              1
          )

          path.write_text(content)
          print("Patched app/build.gradle with release signing config")
          EOF

      # ── Patch MainActivity: remove WebView user-agent "wv" flag ──────────
      # Google blocks OAuth inside standard WebViews based on this flag.
      # Removing it lets Google OAuth work in-page without a Chrome Custom Tab.
      - name: Copy custom Java sources (MainActivity + plugins)
        run: |
          DEST_DIR="artifacts/mystorybook/android/app/src/main/java/com/mystorybook/app"
          cp artifacts/mystorybook/android-extras/com/mystorybook/app/*.java "$DEST_DIR/"
          echo "Copied Java files:"
          ls "$DEST_DIR/"

      # ── Apply custom app icon ─────────────────────────────────────────────
      - name: Copy app icon mipmap resources
        run: |
          RES_DIR="artifacts/mystorybook/android/app/src/main/res"
          # Legacy PNG icons (Android 7 and below)
          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp artifacts/mystorybook/android-extras/res/${density}/ic_launcher.png       "$RES_DIR/${density}/ic_launcher.png"
            cp artifacts/mystorybook/android-extras/res/${density}/ic_launcher_round.png "$RES_DIR/${density}/ic_launcher_round.png"
          done
          # Remove adaptive-icon XMLs so ALL Android versions use the PNG directly.
          # The adaptive-icon foreground kept reverting to the Android robot because the
          # Capacitor-generated vector drawable overrides our custom one. Without these
          # XML files the OS falls back to the density-specific mipmap PNGs above, which
          # contain our correct coral/pink gradient book icon.
          rm -f "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo "App icons applied (PNG only, no adaptive-icon XML)"

      # ── Java 17 (required by modern Gradle / AGP) ─────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        working-directory: artifacts/mystorybook/android
        run: ./gradlew assembleRelease --no-daemon

      # ── Rename APK ────────────────────────────────────────────────────────
      - name: Rename APK
        run: mv artifacts/mystorybook/android/app/build/outputs/apk/release/app-release.apk artifacts/mystorybook/android/app/build/outputs/apk/release/mystorybook.apk

      # ── Upload APK as a downloadable artifact ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStoryBook-release
          path: artifacts/mystorybook/android/app/build/outputs/apk/release/mystorybook.apk
          retention-days: 30

