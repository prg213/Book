kind = "mobile"
previewPath = "/mystorybook-native/"
title = "MyStoryBook Native"
version = "1.0.0"
id = "artifacts/mystorybook-native"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mystorybook-native/" ]
localPort = 25768

[services.development]
run = "pnpm --filter @workspace/mystorybook-native run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mystorybook-native", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mystorybook-native", "run", "serve" ]

[services.env]
PORT = "25768"
BASE_PATH = "/mystorybook-native/"
